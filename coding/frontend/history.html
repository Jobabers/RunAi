<!DOCTYPE html>
<html lang="th"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>History | RunAI</title><link rel="stylesheet" href="styles.css"></head>
<body class="dashboard-body">
  <header class="dashboard-topbar"><a class="brand-link" href="dashboard.html"><span>RunAI</span></a><nav class="topbar-nav" aria-label="หน้าหลัก"><a href="profile.html">Profile</a><a href="goal.html">Goal</a><a href="run.html">Run</a><a class="is-active" aria-current="page" href="history.html">History</a></nav><div class="topbar-actions"><span class="user-pill" id="currentUserLabel">กำลังโหลด...</span><button class="ghost-button" id="logoutButton" type="button">Logout</button></div></header>
  <main class="dashboard-page feature-page">
    <a class="profile-back-link" href="dashboard.html">← กลับไป Dashboard</a>
    <section class="feature-hero"><div><p class="eyebrow">History</p><h1>ประวัติการวิ่ง</h1><p>มองย้อนกลับเพื่อเห็นระยะทางที่คุณสร้างไว้</p></div><div class="hero-kicker">↗<span>Your<br>progress</span></div></section>
    <section class="stats-grid history-stats"><article class="stat-card"><span>Runs</span><strong id="totalRuns">0</strong><small>รายการที่บันทึกแล้ว</small></article><article class="stat-card"><span>Distance</span><strong id="totalDistance">0 km</strong><small>ระยะทางสะสม</small></article><article class="stat-card"><span>Avg. pace</span><strong id="averagePace">-</strong><small>นาทีต่อกิโลเมตร</small></article></section>
    <p class="message hidden" id="pageMessage" role="status"></p>
    <section class="dashboard-panel history-page-list"><div class="panel-heading"><p class="eyebrow">All activities</p><h2>รายการวิ่งทั้งหมด</h2></div><div class="history-list" id="historyList"><p class="empty-state">กำลังโหลดประวัติ...</p></div></section>
  </main><script src="history.js"></script>
</body></html>
