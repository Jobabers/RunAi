<head>

  <title>เข้าสู่ระบบ | RunAI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="auth-topbar">
    <a class="brand-link" href="index.html" aria-label="RunAI"><span>RunAI</span></a>
  </header>

  <main class="auth-page">
    <section class="auth-card auth-card-login" aria-label="Google Sign-In">

        <p class="eyebrow">RUNAI</p>
        <h1>เข้าสู่ระบบ</h1>
      </div>

        ดำเนินการต่อด้วย Google
      </button>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <script src="app.js"></script>
