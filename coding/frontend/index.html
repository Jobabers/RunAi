<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>เข้าสู่ระบบ | RunAI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="auth-topbar">
    <a class="brand-link" href="index.html" aria-label="RunAI">
      <span>RunAI</span>
    </a>
  </header>

  <main class="auth-page">
    <section class="auth-card auth-card-login" aria-label="Login form">
      

      <div class="form-header">
        <h1>Sign in</h1>
        <p>เริ่มวางแผนการวิ่ง ติดตามเควส และดูความคืบหน้าของคุณ</p>
      </div>

      

      <p class="message hidden" id="messageBox"></p>

      <form class="auth-form" data-auth-form="login" id="authForm">
        <label class="field">
          <span>อีเมล</span>
          <span class="input-wrap">
            
            <input autocomplete="email" id="emailInput" name="email" placeholder="Email" required type="email">
          </span>
        </label>

        <label class="field">
          <span>รหัสผ่าน</span>
          <span class="input-wrap">
            <input autocomplete="current-password" id="passwordInput" minlength="8" name="password" placeholder="Password" required type="password">
          </span>
        </label>

        <a class="small-link" href="register.html">ยังไม่มีบัญชี?</a>

        <button class="primary-button" id="submitButton" type="submit">Get Started</button>
      </form>

      <p class="switch-link">
        New runner?
        <a href="register.html">สมัครสมาชิก</a>
      </p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
