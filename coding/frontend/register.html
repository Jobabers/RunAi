<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>สมัครสมาชิก | RunAI</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="auth-topbar">
    <a class="brand-link" href="index.html" aria-label="RunAI">
      <span>RunAI</span>
    </a>
  </header>

  <main class="auth-page">
    <section class="auth-card auth-card-register" aria-label="Register form">

      <div class="form-header">
        <h1>Create Account</h1>
        <p>สร้างบัญชีด้วย Supabase Auth แล้วค่อยกรอก Profile หลังเข้าสู่ระบบ</p>
      </div>


      <p class="message hidden" id="messageBox"></p>

      <form class="auth-form" data-auth-form="register" id="authForm">
        <label class="field">
          <span>อีเมล</span>
          <span class="input-wrap">
            <input autocomplete="email" id="emailInput" name="email" placeholder="Email" required type="email">
          </span>
        </label>

        <div class="two-column">
          <label class="field">
            <span>รหัสผ่าน</span>
            <span class="input-wrap">
              <input autocomplete="new-password" id="passwordInput" minlength="8" name="password" placeholder="Password" required type="password">
            </span>
          </label>

          <label class="field">
            <span>ยืนยันรหัสผ่าน</span>
            <span class="input-wrap">
              <input autocomplete="new-password" id="confirmPasswordInput" minlength="8" placeholder="Confirm" required type="password">
            </span>
          </label>
        </div>

        <button class="primary-button" id="submitButton" type="submit">Create Account</button>
      </form>

      <p class="switch-link">
        Already have an account?
        <a href="index.html">เข้าสู่ระบบ</a>
      </p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
